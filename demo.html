      function useLocalStorage(key, fallback) {
        const [val, setVal] = useState(() => {
          try {
            const raw = localStorage.getItem(key)
            return raw ? JSON.parse(raw) : fallback
          } catch { return fallback }
        })
        const setAndSave = (next) => {
          const resolved = typeof next === 'function' ? next(val) : next
          setVal(resolved)
          try { localStorage.setItem(key, JSON.stringify(resolved)) } catch {}
        }
        return [val, setAndSave]
      }

      function toYmd(d) {
        const y = d.getFullYear()
        const m = String(d.getMonth() + 1).padStart(2, '0')
        const day = String(d.getDate()).padStart(2, '0')
        return `${y}-${m}-${day}`
      }

      function parseYmd(s) {
        if (!s) return new Date()
        const [y, m, d] = s.split('-').map(Number)
        return new Date(y, m - 1, d)
      }

      function fmtDayMonth(d) {
        return `${d.getDate()}/${d.getMonth() + 1}`
      }

      function mondayOf(d) {
        const date = new Date(d)
        const day = (date.getDay() + 6) % 7
        date.setDate(date.getDate() - day)
        date.setHours(0, 0, 0, 0)
        return date
      }

                          className="btn-tactile flex-1 rounded-2xl bg-[#0A4D2E] py-3.5 font-bold text-white hover:bg-[#0D5C36] shadow-md shadow-emerald-950/20"
                        >
                          Lưu cập nhật hồ sơ
                        </button>
                        <button
                          type="button"
                          onClick={() => setTab('home')}
                          className="rounded-2xl border border-slate-200 bg-white px-5 py-3.5 font-bold text-slate-700 hover:bg-slate-50"
                        >
                          Quay lại
                        </button>
                      </div>
                    </form>
                  </div>
                )}

                {/* --- TAB: LỊCH TUẦN (Schedule) --- */}
                {tab === 'schedule' && (
                  <div className="space-y-6 animate-fade-in">
                    <div className="flex items-center justify-between">
                      <div>
                        <h2 className="text-2xl font-black text-[#0A4D2E]">Lịch tập tuần này</h2>
                        <p className="text-xs text-slate-500">Tự động xếp lịch vào các khung giờ bạn rảnh rỗi</p>
                      </div>
                      <button
                        type="button"
                        onClick={() => alert('Đã tạo mới lịch tuần tối ưu!')}
                        className="btn-tactile rounded-full bg-[#0A4D2E] px-4 py-2 text-xs font-bold text-white hover:bg-[#0D5C36]"
                      >
                        ⚡ Xếp lại lịch thông minh
                      </button>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                      {plan?.sessions?.map((s, idx) => (
                        <div key={idx} className="rounded-2xl bg-white p-5 border border-slate-200 shadow-xs space-y-3">
                          <div className="flex items-center justify-between">
                            <span className="font-bold text-slate-900">{DAY_NAMES[s.dayOfWeek - 1]}</span>
                            <span className="rounded-lg bg-emerald-100/70 px-2 py-0.5 text-xs font-bold text-[#0A4D2E]">
                              {s.startTime}
                            </span>
                          </div>
                          <p className="text-xs text-slate-500">{s.minutes} phút · {TIERS[s.session.tier]}</p>
                          <div className="space-y-1.5 pt-2 border-t border-slate-100 text-xs">
                            {s.session.items.map((it, i) => (
                              <div key={i} className="flex items-center justify-between text-slate-700">
                                <span>• {it.name}</span>
                                <span className="font-semibold text-slate-500">{it.sets} hiệp</span>
                              </div>
                            ))}
                          </div>
                          <button
                            type="button"
                            onClick={() => startWorkout(s)}
                            className="btn-tactile w-full rounded-xl bg-[#0A4D2E] py-2 text-xs font-bold text-white hover:bg-[#0D5C36] mt-2"
                          >
                            Bắt đầu buổi này
                          </button>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* --- TAB: TẬP LUYỆN (Workout Session Player) --- */}
                {tab === 'workout' && (
                  <div className="max-w-xl mx-auto rounded-3xl bg-white p-6 sm:p-8 border border-slate-200 shadow-lg space-y-6 animate-fade-in text-center">
                    <div className="inline-flex items-center gap-2 rounded-full bg-emerald-50 px-4 py-1.5 text-xs font-bold text-[#0A4D2E]">
                      <span className="flex h-2 w-2 rounded-full bg-emerald-500 animate-ping" />
                      Đang tập: Buổi toàn thân (30 phút)
                    </div>

                    <div className="space-y-2">
                      <p className="text-xs uppercase tracking-wider text-slate-400 font-bold">Bài tập hiện tại (1/7)</p>
                      <h2 className="text-3xl font-black text-slate-900">Squat không tạ</h2>
                      <p className="text-sm text-slate-500 font-medium">3 hiệp · 12 lần lặp · Nghỉ 45s</p>
                    </div>

                    {/* Timer circle visualization */}
                    <div className="flex items-center justify-center my-6">
                      <div className="flex h-44 w-44 items-center justify-center rounded-full bg-gradient-to-br from-[#E6F7ED] to-[#DCF3E6] border-4 border-[#0A4D2E] shadow-inner text-center">
                        <div>
                          <p className="text-4xl font-black text-[#0A4D2E]">00:45</p>
                          <p className="text-xs font-bold text-emerald-800">Thời gian nghỉ</p>
                        </div>
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <button
                        type="button"
                        onClick={() => alert('Đã hoàn thành 1 hiệp!')}
                        className="btn-tactile rounded-2xl bg-[#0A4D2E] py-3.5 text-sm font-bold text-white hover:bg-[#0D5C36] shadow-md shadow-emerald-950/20"
                      >
                        ✓ Xong 1 hiệp
                      </button>
                      <button
                        type="button"
                        onClick={() => {
                          const newLog = { id: Date.now(), date: toYmd(now), durationMin: 30, rpe: 3 }
                          setLogs([...logs, newLog])
                          setActive(null)
                          alert('🎉 Chúc mừng! Bạn đã hoàn thành xuất sắc buổi tập hôm nay!')
                          setTab('progress')
                        }}
                        className="btn-tactile rounded-2xl bg-emerald-100 hover:bg-emerald-200 py-3.5 text-sm font-bold text-[#0A4D2E]"
                      >
                        Hoàn thành buổi tập
                      </button>
                    </div>
                  </div>
                )}

                {/* --- TAB: TIẾN ĐỘ (Progress & Logs) --- */}
                {tab === 'progress' && (
                  <div className="space-y-6 animate-fade-in">
                    <div>
                      <h2 className="text-2xl font-black text-[#0A4D2E]">Nhật ký & Tiến độ rèn luyện</h2>
                      <p className="text-xs text-slate-500">Theo dõi chuỗi ngày tập liên tục và thống kê chi tiết</p>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                      <div className="rounded-2xl bg-white p-5 border border-slate-200 shadow-xs">
                        <p className="text-xs text-slate-500 font-medium">Buổi hoàn thành tuần này</p>
                        <p className="text-3xl font-black text-[#0A4D2E] mt-1">{weekCount} / {goal}</p>
                      </div>
                      <div className="rounded-2xl bg-white p-5 border border-slate-200 shadow-xs">
                        <p className="text-xs text-slate-500 font-medium">Tổng số buổi đã tập</p>
                        <p className="text-3xl font-black text-slate-900 mt-1">{logs.length}</p>
                      </div>
                      <div className="rounded-2xl bg-white p-5 border border-slate-200 shadow-xs">
                        <p className="text-xs text-slate-500 font-medium">Tổng thời gian vận động</p>
                        <p className="text-3xl font-black text-emerald-700 mt-1">{logs.reduce((a, b) => a + (b.durationMin || 30), 0)} phút</p>
                      </div>
                    </div>

                    <div className="rounded-2xl bg-white p-5 border border-slate-200 shadow-xs space-y-3">
                      <h3 className="font-bold text-slate-900 text-sm">Lịch sử tập luyện gần đây</h3>
                      {logs.length === 0 ? (
                        <p className="text-xs text-slate-400 py-4 text-center">Chưa có buổi tập nào được ghi nhận. Hãy hoàn thành buổi tập đầu tiên!</p>
                      ) : (
                        <div className="divide-y divide-slate-100">
                          {logs.map((l, i) => (
                            <div key={i} className="py-2.5 flex items-center justify-between text-xs">
                              <span className="font-bold text-slate-800">📅 {l.date}</span>
                              <span className="text-emerald-700 font-semibold">{l.durationMin || 30} phút · Hoàn thành</span>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  </div>
                )}
              </main>

              {/* Footer Notice */}
              <footer className="mt-12 border-t border-slate-200/80 py-6 text-center text-xs text-slate-400">
                Nội dung mang tính tham khảo, không thay thế tư vấn y tế hoặc bác sĩ chuyên khoa.
              </footer>
            </div>

            {/* 3. MOBILE BOTTOM NAVIGATION */}
            <nav className="fixed inset-x-0 bottom-0 z-40 grid grid-cols-5 border-t border-slate-200/90 bg-white/95 backdrop-blur-md shadow-xl lg:hidden">
              {[
                { id: 'home', label: 'Trang chủ', icon: '🏠' },
                { id: 'onboarding', label: 'Hồ sơ', icon: '👤' },
                { id: 'schedule', label: 'Lịch tuần', icon: '📅' },
                { id: 'workout', label: 'Tập luyện', icon: '🏋️' },
                { id: 'progress', label: 'Tiến độ', icon: '⏱️' },
              ].map((item) => (
                <button
                  key={item.id}
                  type="button"
                  onClick={() => setTab(item.id)}
                  className={`flex min-h-[56px] flex-col items-center justify-center py-2 px-1 text-[11px] font-semibold transition-all ${
                    tab === item.id ? 'text-[#0A4D2E] scale-105' : 'text-slate-500'
                  }`}
                >
                  <span className="text-base">{item.icon}</span>
                  <span className="mt-0.5 leading-tight">{item.label}</span>
                </button>
              ))}
            </nav>

            {/* 4. AUTH MODAL */}
            <AuthModal
              isOpen={isAuthOpen}
              onClose={() => setIsAuthOpen(false)}
              user={user}
              setUser={setUser}
            />
          </div>
        )
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />)
    </script>
  </body>
</html>
